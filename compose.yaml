services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: klinik
      POSTGRES_USER: klinik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klinik']
      interval: 10s
      retries: 5
  app:
    profiles: [production]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://klinik:${POSTGRES_PASSWORD}@db:5432/klinik
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media
volumes:
  postgres:
  media:
